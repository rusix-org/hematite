[build]
target = "aarch64-unknown-none"
jobs = 2

[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-Tcrates/hm-core/linker.ld", "-C", "link-arg=--build-id=none"]

[target.aarch64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "link-arg=-Tcrates/hm-core/linker-aarch64.ld", "-C", "link-arg=--build-id=none"]
